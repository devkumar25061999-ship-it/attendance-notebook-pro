name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android APK (Debug & Release unsigned)
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Build Android App Bundle (AAB for Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-Pro-Release-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Release AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-Pro-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
